name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string

permissions:
  contents: read

env:
  DEPLOY_SCRIPT: ${{ inputs.environment == 'production' && 'deploy' || 'deploy:staging' }}

jobs:
  agent:
    name: Deploy agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          bun --filter @hackspain/agent "$DEPLOY_SCRIPT" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          test -n "$url" || { echo "Deploy output did not include a workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test /health
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EXPECTED: ${{ inputs.environment }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/health" \
            | jq -e --arg env "$EXPECTED" '.ok == true and .environment == $env'

  web:
    name: Deploy web
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          bun --filter @hackspain/web "$DEPLOY_SCRIPT" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          test -n "$url" || { echo "Deploy output did not include a workers.dev URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test /api/health through the web proxy
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EXPECTED: ${{ inputs.environment }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/api/health" \
            | jq -e --arg env "$EXPECTED" '.ok == true and .environment == $env'
