[project]
name = "xray-pipeline"
version = "0.1.0"
description = "Scores every company and month from the Embat CSVs and exports the X Ray artifacts"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "polars==1.40.0",
]

[project.scripts]
xray = "xray.cli:main"

[dependency-groups]
dev = ["pytest==9.1.0"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "xray"
